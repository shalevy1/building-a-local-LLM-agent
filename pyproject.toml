[project]
name = "ollama-chat-examples"
version = "0.1.0"
description = "Progressive CLI chat loop examples for Ollama and Qwen"
requires-python = ">=3.9"
authors = [
    { name = "Jes Fink-Jensen", email = "jes@finkjensen.be" }
]
dependencies = [
    "ollama>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "00-basic-loop/src/chat_00",
    "00-basic-loop-thinking/src/chat_00_thinking",
    "01-tools/src/chat_01",
    "02-skills-tool/src/chat_02",
    "03-skills-tool-slash/src/chat_03",
    "04-history/src/chat_04",
    "05-compaction/src/chat_05",
]

[project.scripts]
chat-qwen-00    = "chat_00.main:chat"
chat-qwen-00-th = "chat_00_thinking.main:chat"
chat-qwen-01    = "chat_01.main:chat"
chat-qwen-02    = "chat_02.main:chat"
chat-qwen-03    = "chat_03.main:chat"
chat-qwen-04    = "chat_04.main:chat"
chat-qwen-05    = "chat_05.main:chat"
