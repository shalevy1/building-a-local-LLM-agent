[project]
name = "ollama-chat-app"
version = "0.1.0"
description = "A simple CLI chat loop for Ollama and Qwen"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Jes Fink-Jensen", email = "jes@finkjensen.be" }
]
dependencies = [
    "ollama>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_chat_app"]

[project.scripts]
chat-qwen-00 = "ollama_chat_app.main:chat"